<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>墨笈 · 字母雨</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%BF%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="stylesheet" href="styles/style.css?v=2">
    <!-- 字体仅动画时使用：非阻塞加载（media=print + onload 切回 all），不拖慢首屏 -->
    <link rel="stylesheet" href="styles/fonts.css?v=1" media="print" onload="this.media='all'">
</head>
<body>

    <!-- 控制台：薄荷清爽风 -->
    <main class="app">
        <div class="app-header">
            <div class="app-logo">
                <!-- 字母雨图标：五列下落字符流，底部圆点为末端高亮字符 -->
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M4 5v9"/>
                    <path d="M8 5v14"/>
                    <path d="M12 5v16"/>
                    <path d="M16 5v11"/>
                    <path d="M20 5v8"/>
                    <circle cx="4" cy="14" r="1.2" fill="currentColor" stroke="none"/>
                    <circle cx="8" cy="19" r="1.2" fill="currentColor" stroke="none"/>
                    <circle cx="12" cy="21" r="1.2" fill="currentColor" stroke="none"/>
                    <circle cx="16" cy="16" r="1.2" fill="currentColor" stroke="none"/>
                    <circle cx="20" cy="13" r="1.2" fill="currentColor" stroke="none"/>
                </svg>
            </div>
            <div>
                <h1 class="app-title">墨笈 · 字母雨</h1>
                <p class="app-subtitle">文字洗礼，沐浴辉光，沉心敛气</p>
            </div>
        </div>

        <div class="divider"></div>

        <div class="controls">
            <!-- 字符集 -->
            <div class="control-group">
                <div class="control-label">字符集</div>
                <div class="segmented">
                    <label>
                        <input type="radio" name="charset" value="chinese" checked>
                        <span>🌿 中文</span>
                    </label>
                    <label>
                        <input type="radio" name="charset" value="ascii">
                        <span>⚡ ASCII</span>
                    </label>
                </div>
            </div>

            <!-- 文本：自动识别 data/ 下的 txt -->
            <div class="control-group" id="textGroup">
                <div class="control-label">文本</div>
                <div class="custom-select" id="textSelectWrap">
                    <button type="button" class="custom-select-trigger" id="textSelectTrigger">
                        <span class="custom-select-value" id="textSelectValue">加载中…</span>
                        <svg class="custom-select-arrow" width="12" height="8" viewBox="0 0 12 8" fill="none" aria-hidden="true">
                            <path d="M1 1l5 5 5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                    <div class="custom-select-menu" id="textSelectMenu" hidden></div>
                </div>
            </div>

            <!-- 字体 -->
            <div class="control-group" id="fontGroup">
                <div class="control-label">字体</div>
                <div class="custom-select" id="fontSelectWrap">
                    <button type="button" class="custom-select-trigger" id="fontSelectTrigger">
                        <span class="custom-select-value" id="fontSelectValue">等宽（默认）</span>
                        <svg class="custom-select-arrow" width="12" height="8" viewBox="0 0 12 8" fill="none" aria-hidden="true">
                            <path d="M1 1l5 5 5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                    <div class="custom-select-menu" id="fontSelectMenu" hidden></div>
                </div>
            </div>

            <!-- 字号 -->
            <div class="control-group">
                <div class="control-label">字号</div>
                <div class="slider-row">
                    <input type="range" id="fontSize" min="10" max="28" step="1" value="14">
                    <span class="slider-value" id="fontSizeValue">14px</span>
                </div>
            </div>

            <!-- 速度 -->
            <div class="control-group">
                <div class="control-label">速度</div>
                <div class="slider-row">
                    <input type="range" id="speed" min="20" max="120" step="5" value="50">
                    <span class="slider-value" id="speedValue">50ms</span>
                </div>
            </div>

            <!-- 颜色 -->
            <div class="control-group">
                <div class="control-label">颜色</div>
                <div class="color-options">
                    <label class="color-dot">
                        <input type="radio" name="color" value="#0F0" checked>
                        <span class="swatch" style="background:#0F0;"></span>
                        <span>经典绿</span>
                    </label>
                    <label class="color-dot">
                        <input type="radio" name="color" value="#00E5A0">
                        <span class="swatch" style="background:#00E5A0;"></span>
                        <span>薄荷</span>
                    </label>
                    <label class="color-dot">
                        <input type="radio" name="color" value="#00BFFF">
                        <span class="swatch" style="background:#00BFFF;"></span>
                        <span>青蓝</span>
                    </label>
                    <label class="color-dot">
                        <input type="radio" name="color" value="#FFB300">
                        <span class="swatch" style="background:#FFB300;"></span>
                        <span>琥珀</span>
                    </label>
                    <label class="color-dot">
                        <input type="radio" name="color" value="#D4AF37">
                        <span class="swatch" style="background:linear-gradient(135deg,#F6D47A 0%,#D4AF37 55%,#8C6A1D 100%);"></span>
                        <span>鎏金</span>
                    </label>
                    <label class="color-dot" id="customColorDot" title="自定义颜色">
                        <input type="radio" name="color" value="custom">
                        <span class="swatch rainbow" id="customSwatch"></span>
                        <span>自定义</span>
                    </label>
                </div>

                <!-- 自定义色盘浮窗 -->
                <div class="color-popover" id="colorPopover" hidden>
                    <div class="popover-title">自定义颜色</div>
                    <input type="color" id="customColorPicker" value="#2EBFA6">
                    <input type="text" id="customColorText" placeholder="HEX 如 #2EBFA6，或 rgb(46,191,166)" spellcheck="false">
                    <button type="button" class="btn btn-small" id="colorApply">应用</button>
                </div>
            </div>
        </div>

        <div class="actions">
            <button class="btn btn-start" id="startBtn">▶ 开始字母雨</button>
            <div class="fullscreen-box" title="进入全屏模式">
                <span class="control-label">全屏</span>
                <label class="toggle">
                    <input type="checkbox" id="fullscreen" checked>
                    <span class="track"></span>
                    <span class="thumb"></span>
                </label>
            </div>
        </div>

        <div class="hint-box">
            <strong>快捷操作：</strong>
            <kbd>S</kbd> 退出字母雨
        </div>

        <p class="app-footer">版权 © 2026 LynxStation | <a href="https://doc.lynxstudio.top" target="_blank" rel="noopener">聆息工作室</a></p>
    </main>

    <script src="scripts/matrix-rain.js?v=5"></script>
    <script>
        (function () {
            'use strict';

            var startBtn = document.getElementById('startBtn');

            // ---------- 自定义下拉组件（展开菜单完全主题化） ----------
            function makeCustomSelect(trigger, valueEl, menu, getItems, onSelect) {
                var wrap = trigger.parentElement;

                function closeAll() {
                    document.querySelectorAll('.custom-select-menu').forEach(function (m) { m.hidden = true; });
                    document.querySelectorAll('.custom-select-trigger').forEach(function (t) { t.classList.remove('open'); });
                }

                function render() {
                    menu.innerHTML = '';
                    getItems().forEach(function (item) {
                        var div = document.createElement('div');
                        div.className = 'custom-select-option';
                        div.textContent = item.label;
                        if (item.value === wrap.dataset.value) div.classList.add('selected');
                        div.addEventListener('click', function () {
                            wrap.dataset.value = item.value;
                            valueEl.textContent = item.label;
                            closeAll();
                            render();
                            if (onSelect) onSelect(item.value);
                        });
                        menu.appendChild(div);
                    });
                }

                trigger.addEventListener('click', function (e) {
                    e.stopPropagation();
                    var isOpen = !menu.hidden;
                    closeAll();
                    menu.hidden = isOpen;
                    trigger.classList.toggle('open', !isOpen);
                    if (!isOpen) render(); // 每次展开前重渲染，确保列表最新
                });

                document.addEventListener('click', function () {
                    menu.hidden = true;
                    trigger.classList.remove('open');
                });

                // 初始化默认选中第一项
                var items = getItems();
                if (items.length && !wrap.dataset.value) {
                    wrap.dataset.value = items[0].value;
                    valueEl.textContent = items[0].label;
                }
                render();

                return {
                    rerender: render,
                    getValue: function () { return wrap.dataset.value; }
                };
            }

            // ---------- 字体下拉（固定列表） ----------
            var FONT_ITEMS = [
                { value: 'mono', label: '等宽' },
                { value: 'song', label: '宋体' },
                { value: 'hei', label: '黑体' },
                { value: 'kai', label: '楷体' },
                { value: 'wenkai', label: '霞鹜文楷' },
                { value: 'zhuque', label: '朱雀仿宋' },
                { value: 'yahei', label: '雅黑' }
            ];
            var fontLoading = false;
            var fontLoadToken = 0;
            var startBtnOriginalText = startBtn.textContent;
            makeCustomSelect(
                document.getElementById('fontSelectTrigger'),
                document.getElementById('fontSelectValue'),
                document.getElementById('fontSelectMenu'),
                function () { return FONT_ITEMS; },
                function (value) {
                    if (!window.MatrixRain.isWebFont || !window.MatrixRain.isWebFont(value)) return;
                    if (!window.MatrixRain.preloadFont) return;
                    var token = ++fontLoadToken;
                    fontLoading = true;
                    startBtn.disabled = true;
                    startBtn.textContent = '等待所选字体加载';
                    window.MatrixRain.preloadFont(value).then(function () {
                        if (token !== fontLoadToken) return;
                        fontLoading = false;
                        startBtn.textContent = startBtnOriginalText;
                        startBtn.disabled = window.MatrixRain.isRunning();
                    });
                }
            );

            // ---------- 文本下拉：自动识别 data/ 下的 txt ----------
            // 内置兜底清单（manifest 拉取失败时使用）
            var DEFAULT_TEXTS = [
                { file: 'daodejing.txt', label: '道德经' },
                { file: 'xinjing.txt', label: '心经' }
            ];
            var TEXT_ITEMS = DEFAULT_TEXTS.map(function (i) { return { value: i.file, label: i.label }; });
            var textSelect = makeCustomSelect(
                document.getElementById('textSelectTrigger'),
                document.getElementById('textSelectValue'),
                document.getElementById('textSelectMenu'),
                function () { return TEXT_ITEMS; }
            );

            function populateTextSelect(list) {
                // manifest 条目为 {file,label}，统一映射为 {value,label}
                TEXT_ITEMS = (list && list.length)
                    ? list.map(function (i) { return { value: i.file, label: i.label }; })
                    : DEFAULT_TEXTS.map(function (i) { return { value: i.file, label: i.label }; });
                // 若当前选中值不在新列表中，重置为第一项
                if (TEXT_ITEMS.length && !TEXT_ITEMS.some(function (i) { return i.value === textSelect.getValue(); })) {
                    document.getElementById('textSelectWrap').dataset.value = TEXT_ITEMS[0].value;
                    document.getElementById('textSelectValue').textContent = TEXT_ITEMS[0].label;
                }
                textSelect.rerender();
            }

            // ---------- 数据加载：首屏优先，空闲后再拉 manifest 并“依次”预取 txt ----------
            // 串行下载，避免多个大文件并发抢占带宽、影响页面交互
            function prefetchTextsSequentially(items) {
                var i = 0;
                function next() {
                    if (i >= items.length) return;
                    var file = items[i].file;
                    i++;
                    var job = (window.MatrixRain && window.MatrixRain.loadTextSource)
                        ? window.MatrixRain.loadTextSource(file)
                        : Promise.resolve();
                    Promise.resolve(job).catch(function () {}).then(next);
                }
                next();
            }

            function startDataLoading() {
                if (!window.fetch) {
                    populateTextSelect(DEFAULT_TEXTS);
                    return;
                }
                // 优先拉取 manifest.json（随 data 目录自动生成），失败回退内置清单
                fetch('data/manifest.json', { cache: 'no-cache' })
                    .then(function (r) {
                        if (!r.ok) throw new Error('HTTP ' + r.status);
                        return r.json();
                    })
                    .then(function (list) {
                        var items = (list && list.length) ? list : DEFAULT_TEXTS;
                        populateTextSelect(items);
                        prefetchTextsSequentially(items);
                    })
                    .catch(function () {
                        populateTextSelect(DEFAULT_TEXTS);
                        prefetchTextsSequentially(DEFAULT_TEXTS);
                    });
            }

            // 等 DOM 就绪且浏览器空闲后再下载数据，先让页面可见、可交互
            function bootData() {
                if (window.requestIdleCallback) {
                    window.requestIdleCallback(startDataLoading, { timeout: 1500 });
                } else {
                    window.setTimeout(startDataLoading, 200);
                }
            }
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', bootData);
            } else {
                bootData();
            }

            // ---------- 自定义颜色浮窗 ----------
            var customColor = '#2EBFA6';
            var colorPopover = document.getElementById('colorPopover');
            var customColorPicker = document.getElementById('customColorPicker');
            var customColorText = document.getElementById('customColorText');
            var colorApply = document.getElementById('colorApply');
            var customSwatch = document.getElementById('customSwatch');

            // 自定义色块圆圈显示当前设定颜色
            function updateCustomSwatch() {
                customSwatch.style.background = customColor;
            }

            // ---------- ASCII 模式下隐藏"文本/字体"设置 ----------
            var textGroup = document.getElementById('textGroup');
            var fontGroup = document.getElementById('fontGroup');

            function toggleTextAndFont() {
                var ascii = document.querySelector('input[name="charset"]:checked').value === 'ascii';
                textGroup.style.display = ascii ? 'none' : '';
                fontGroup.style.display = ascii ? 'none' : '';
            }
            document.querySelectorAll('input[name="charset"]').forEach(function (r) {
                r.addEventListener('change', toggleTextAndFont);
            });
            toggleTextAndFont();

            function hidePopover() {
                colorPopover.hidden = true;
            }

            function toHex(r, g, b) {
                r = Math.min(255, Math.max(0, parseInt(r, 10) || 0));
                g = Math.min(255, Math.max(0, parseInt(g, 10) || 0));
                b = Math.min(255, Math.max(0, parseInt(b, 10) || 0));
                return '#' + [r, g, b].map(function (n) { return ('0' + n.toString(16)).slice(-2); }).join('');
            }

            // 支持 #RGB / #RRGGBB / rgb(r,g,b) / r,g,b
            function parseColorInput(str) {
                var s = String(str).trim().toLowerCase();
                if (/^#([0-9a-f]{3}|[0-9a-f]{6})$/.test(s)) {
                    if (s.length === 4) s = '#' + s[1] + s[1] + s[2] + s[2] + s[3] + s[3];
                    return s;
                }
                var m = s.match(/^rgb\(\s*(\d{1,3})\s*,\s*(\d{1,3})\s*,\s*(\d{1,3})\s*\)$/);
                if (m) return toHex(m[1], m[2], m[3]);
                var m2 = s.match(/^(\d{1,3})[,\s]+(\d{1,3})[,\s]+(\d{1,3})$/);
                if (m2) return toHex(m2[1], m2[2], m2[3]);
                return null;
            }

            // 点击"自定义"色块：选中该项并弹出浮窗
            document.getElementById('customColorDot').addEventListener('click', function () {
                colorPopover.hidden = false;
                customColorPicker.focus();
            });

            customColorPicker.addEventListener('input', function () {
                customColor = customColorPicker.value;
                customColorText.value = customColor;
                updateCustomSwatch();
            });

            customColorText.addEventListener('input', function () {
                var parsed = parseColorInput(customColorText.value);
                if (parsed) {
                    customColor = parsed;
                    customColorPicker.value = parsed;
                    updateCustomSwatch();
                }
            });

            colorApply.addEventListener('click', function () {
                var parsed = parseColorInput(customColorText.value);
                if (parsed) customColor = parsed;
                updateCustomSwatch();
                hidePopover();
                document.querySelector('input[name="color"][value="custom"]').checked = true;
            });

            // 点击浮窗外部关闭（自定义色块内部点击不关闭）
            document.addEventListener('click', function (e) {
                var dot = document.getElementById('customColorDot');
                if (!colorPopover.hidden &&
                    !colorPopover.contains(e.target) &&
                    !dot.contains(e.target)) {
                    hidePopover();
                }
            });

            // ---------- 同步控制项到动画配置 ----------
            function syncOptions() {
                var colorRadio = document.querySelector('input[name="color"]:checked');
                var color = colorRadio.value === 'custom' ? customColor : colorRadio.value;
                window.MatrixRain.setOptions({
                    charset: document.querySelector('input[name="charset"]:checked').value,
                    textSource: document.getElementById('textSelectWrap').dataset.value || 'daodejing.txt',
                    fontSize: parseInt(document.getElementById('fontSize').value, 10),
                    fontFamily: document.getElementById('fontSelectWrap').dataset.value || 'mono',
                    frameDelay: parseInt(document.getElementById('speed').value, 10),
                    color: color,
                    fullscreen: document.getElementById('fullscreen').checked
                });
            }

            // 开始
            startBtn.addEventListener('click', function () {
                syncOptions();
                window.MatrixRain.start();
            });

            // 运行状态联动开始按钮（动画期间禁用开始）
            setInterval(function () {
                var running = window.MatrixRain.isRunning();
                startBtn.disabled = running || fontLoading;
            }, 300);

            // 滑杆数值显示
            var fontSize = document.getElementById('fontSize');
            var fontSizeValue = document.getElementById('fontSizeValue');
            var speed = document.getElementById('speed');
            var speedValue = document.getElementById('speedValue');

            fontSize.addEventListener('input', function () {
                fontSizeValue.textContent = fontSize.value + 'px';
            });
            speed.addEventListener('input', function () {
                speedValue.textContent = speed.value + 'ms';
            });
        })();
    </script>
</body>
</html>
